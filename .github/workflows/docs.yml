name: Documentation checks

"on":
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".agents/**"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - "docs/**"
      - ".agents/**"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install documentation validator dependency
        run: python3 -m pip install --disable-pip-version-check -r docs/review/tools/requirements.txt
      - name: Check functional catalog
        run: python3 docs/functional/tools/build_catalog.py --check
      - name: Check review, links and local skills
        run: python3 docs/review/tools/check_review.py
